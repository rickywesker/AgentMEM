[project]
name = "agentmem"
version = "0.1.0"
description = "Agent Memory Leaderboard 2026 submission — Add/Search memory service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "numpy>=2.1",
    "pydantic>=2.10",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmem"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream benchmark repos — not ours to lint.
extend-exclude = ["harness/datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Verbatim copies of the platform's answer and judge prompts. Rewrapping them
# would change the strings we are scored against.
"harness/contracts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
